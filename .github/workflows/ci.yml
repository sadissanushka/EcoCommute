name: Continuous Integration & Security Pipeline

on:
  push:
    branches: [ main, 'feat/**', 'feature/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Secrets & Credentials Audit (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  lint-and-test:
    name: Node Test & PostGIS Integration
    runs-on: ubuntu-latest
    needs: security-scan

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: corporate_shuttle
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d corporate_shuttle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Environment Secrets Hygiene
        run: |
          test ! -f .env || (echo "ERROR: Raw .env file detected in repository!" && exit 1)

      - name: Execute Migration Pipeline
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/corporate_shuttle
        run: |
          cd infra/migrations
          npm ci
          npm run migrate:up
          npm run migrate:status

      - name: Verify Routing Engine Service
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/corporate_shuttle
        run: |
          cd services/routing-engine
          npm ci
          npm run lint
          npm test

      - name: Verify Wallet & Carbon Service
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/corporate_shuttle
        run: |
          cd services/wallet
          npm ci
          npm run lint
          npm test

  docker-verify:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: shuttle_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: corporate_shuttle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./docker/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corporate_shuttle"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: shuttle_pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@syscolabs.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgis:
        condition: service_healthy

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: shuttle_gateway
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_started
      booking:
        condition: service_started
      routing-engine:
        condition: service_started
    environment:
      PORT: 8080
      AUTH_SERVICE_URL: http://auth:3001
      BOOKING_SERVICE_URL: http://booking:3002
      ROUTING_SERVICE_URL: http://routing-engine:3000
      WALLET_SERVICE_URL: http://wallet-service:8083
      SAFETY_SERVICE_URL: http://safety-service:4400
      ANALYTICS_SERVICE_URL: http://analytics-service:8085
      NODE_ENV: production
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: shuttle_auth
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@postgis:5432/corporate_shuttle
      DB_HOST: postgis
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: corporate_shuttle
      JWT_SECRET: super-secret-jwt-key-for-dev-change-in-prod-2026!
      NODE_ENV: production
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  booking:
    build:
      context: ./services/booking
      dockerfile: Dockerfile
    container_name: shuttle_booking
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PORT: 3002
      DATABASE_URL: postgres://postgres:postgres@postgis:5432/corporate_shuttle
      DB_HOST: postgis
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: corporate_shuttle
      JWT_SECRET: super-secret-jwt-key-for-dev-change-in-prod-2026!
      NODE_ENV: production
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  routing-engine:
    build:
      context: ./services/routing-engine
      dockerfile: Dockerfile
    container_name: shuttle_routing_engine
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgis:5432/corporate_shuttle
      DB_HOST: postgis
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: corporate_shuttle
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  safety-service:
    build:
      context: ./services/safety
      dockerfile: Dockerfile
    container_name: shuttle_safety_service
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PORT: 4400
      DATABASE_URL: postgres://postgres:postgres@postgis:5432/corporate_shuttle
      DB_HOST: postgis
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: corporate_shuttle
      JWT_SECRET: super-secret-jwt-key-for-dev-change-in-prod-2026!
      NODE_ENV: production
    ports:
      - "4400:4400"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4400/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    container_name: shuttle_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      gateway:
        condition: service_started
      safety-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  wallet-service:
    build:
      context: ./services/wallet
      dockerfile: Dockerfile
    container_name: shuttle_wallet_service
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PORT: 8083
      DATABASE_URL: postgres://postgres:postgres@postgis:5432/corporate_shuttle
      DB_HOST: postgis
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: corporate_shuttle
      NODE_ENV: production
    ports:
      - "8083:8083"

  analytics-service:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: shuttle_analytics_service
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PORT: 8085
      DATABASE_URL: postgres://postgres:postgres@postgis:5432/corporate_shuttle
      DB_HOST: postgis
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: corporate_shuttle
      NODE_ENV: production
    ports:
      - "8085:8085"

  dashboards:
    build:
      context: ./apps/dashboards
      dockerfile: Dockerfile
    container_name: shuttle_dashboards
    restart: unless-stopped
    environment:
      PORT: 3005
      NEXT_PUBLIC_ANALYTICS_API_URL: http://analytics-service:8085
      NODE_ENV: production
    ports:
      - "3005:3005"

volumes:
  postgis_data:
    name: shuttle_postgis_data
